services:
  redis:
    restart: always
    image: redis:alpine
    container_name: redis
    ports:
      - "${REDIS_PORT-6379}:6379"
    networks:
      - backend
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    command: redis-server --appendonly yes

  db:
    restart: always
    image: postgres
    container_name: mlflow_db
    expose:
      - "${PG_PORT-5432}"
    networks:
      - backend
    environment:
      - POSTGRES_USER=${PG_USER-postgres}
      - POSTGRES_PASSWORD=${PG_PASSWORD-postgres}
      - POSTGRES_DATABASE=${PG_DATABASE-postgres}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-p", "${PG_PORT-5432}", "-U", "${PG_USER-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 3
  mongodb:
    restart: always
    image: mongo:latest
    container_name: mongodb
    ports:
      - "${MONGO_PORT-27017}:27017"
    networks:
      - backend
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD-admin}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE-maxa_ds}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 3
  s3:
    restart: always
    image: minio/minio
    container_name: mlflow_minio
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT-9000}:9000"
      - "${MINIO_CONSOLE_PORT-9001}:9001"
    networks:
      - frontend
      - backend
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD-minioadmin}
      - MINIO_ADDRESS=${MINIO_ADDRESS-0.0.0.0}
      - MINIO_PORT=${MINIO_PORT-9000}
      - MINIO_STORAGE_USE_HTTPS=${MINIO_STORAGE_USE_HTTPS-false}
      - MINIO_CONSOLE_ADDRESS=${MINIO_CONSOLE_ADDRESS-0.0.0.0}
    command: server /data --address "0.0.0.0:${MINIO_PORT-9000}" --console-address "0.0.0.0:${MINIO_CONSOLE_PORT-9001}"
    healthcheck: 
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  tracking_server:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: mlflow_server
    container_name: mlflow_server
    depends_on:
      - db
      - s3
    ports:
      - "${MLFLOW_PORT-5000}:5000"
    networks:
      - frontend
      - backend
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY-minioadmin}
      - MLFLOW_S3_ENDPOINT_URL=http://s3:${MINIO_PORT-9000}
      - MLFLOW_S3_IGNORE_TLS=true
    command: >
      mlflow server
      --backend-store-uri postgresql://${PG_USER-postgres}:${PG_PASSWORD-postgres}@db:${PG_PORT-5432}/${PG_DATABASE-postgres}
      --host 0.0.0.0
      --serve-artifacts
      --artifacts-destination s3://${MLFLOW_BUCKET_NAME-mlflow}
      --allowed-hosts "tracking_server:5000,localhost:5000,127.0.0.1:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MLFLOW_PORT-5000}/"]
      interval: 30s
      timeout: 10s
      retries: 3

  mcp_server:
    restart: always
    build:
      context: ../
      dockerfile: docker/Dockerfile.mcp
    image: mcp_server
    container_name: mcp_server
    ports:
      - "${MCP_PORT-8001}:8001"
    networks:
      - frontend
      - backend
    environment:
      - MLFLOW_SERVER_URL=http://tracking_server:${MLFLOW_PORT-5000}
      - MCP_HOST=${MCP_HOST-0.0.0.0}
      - MCP_PORT=${MCP_PORT-8001}
      - MONGO_USER=${MONGO_USER-admin}
      - MONGO_PASSWORD=${MONGO_PASSWORD-admin}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB=${MONGO_DATABASE-maxa_ds}
      - MINIO_ENDPOINT=s3:${MINIO_PORT-9000}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD-minioadmin}
      - REDIS_URL=redis://redis:6379/0
    command: ["python", "-m", "src.mcp.server"]
    volumes:
      - ../datasets:/app/datasets
    depends_on:
      - tracking_server
      - mongodb
      - s3
      - redis

  celery_worker:
    restart: always
    build:
      context: ../
      dockerfile: docker/Dockerfile.mcp
    image: mcp_server
    container_name: celery_worker
    networks:
      - backend
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MONGO_USER=${MONGO_USER-admin}
      - MONGO_PASSWORD=${MONGO_PASSWORD-admin}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB=${MONGO_DATABASE-maxa_ds}
      - MINIO_ENDPOINT=s3:${MINIO_PORT-9000}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD-minioadmin}
      - MLFLOW_SERVER_URL=http://tracking_server:${MLFLOW_PORT-5000}
    command: ["celery", "-A", "src.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      - redis
      - mongodb
      - s3
      - tracking_server

  flower:
    restart: always
    build:
      context: ../
      dockerfile: docker/Dockerfile.mcp
    image: mcp_server
    container_name: flower
    ports:
      - "${FLOWER_PORT-5555}:5555"
    networks:
      - frontend
      - backend
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: ["celery", "-A", "src.workers.celery_app", "flower", "--port=5555"]
    depends_on:
      - redis
      - celery_worker

volumes:
  db_data:
  minio_data:
  mongodb_data:
  redis_data:

networks:
    frontend:
      driver: bridge
    backend:
      driver: bridge