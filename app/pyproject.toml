[tool.poetry]
name = "maxa-data-scientist"
version = "0.1.0"
description = "AI-powered data science assistant with natural language interface"
authors = ["None"]
packages = [
    { include = "src" }
]

[tool.poetry.scripts]
maxa-ds = "cli:app"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
# Development and testing
ruff = ">=0.14.10,<0.15.0"
pytest = ">=8.2.0,<9.0.0"
pytest-mock = ">=3.15.1,<4.0.0"
pytest-asyncio = ">=0.24.0,<0.27.0"
pytest-cov = ">=6.0.0,<7.0.0"
# Authentication
keyrings-google-artifactregistry-auth = ">=1.1.2,<2.0.0"
# API server
fastapi = ">=0.115.0,<1.0.0"
uvicorn = {extras = ["standard"], version = ">=0.32.0,<1.0.0"}
websockets = ">=15.0.0,<16.0.0"
redis = {extras = ["hiredis"], version = ">=5.0.0,<6.0.0"}
minio = ">=7.2.0,<8.0.0"
aioboto3 = ">=13.0.0,<14.0.0"  # Async S3/MinIO client
asyncpg = ">=0.29.0,<0.30.0"  # PostgreSQL async driver
psycopg2-binary = ">=2.9.9,<3.0.0"  # PostgreSQL sync (Celery callbacks)
# Task queue
celery = {extras = ["redis"], version = ">=5.4.0,<6.0.0"}
# AI and agent framework
anthropic = ">=0.75.0,<0.76.0"
fastmcp = ">=2.14.1,<3.0.0"
langchain = {extras = ["anthropic"], version = ">=1.2.0,<2.0.0"}
langchain-google-vertexai = ">=2.0.0,<3.0.0"
# Core dependencies - Using Pydantic >=2.11.7 for fastmcp compatibility
pydantic = ">=2.11.7,<3.0.0"
pydantic-settings = ">=2.0.0,<3.0.0"
loguru = ">=0.7.3,<0.8.0"
rich = ">=14.2.0,<15.0.0"
typer = ">=0.15.0,<1.0.0"
langgraph = ">=1.0.2,<2.0.0"
polars = ">=1.16.0,<2.0.0"
# Data science and transformations (for maxa-ds-ci integration)
pandas = ">=2.0.0,<3.0.0"
numpy = ">=1.26.0,<2.0.0"
scikit-learn = ">=1.5.0,<2.0.0"
scipy = ">=1.11.0,<2.0.0"
networkx = ">=3.4.0,<4.0.0"
matplotlib = ">=3.9.0,<4.0.0"
seaborn = ">=0.13.0,<1.0.0"
mpld3 = ">=0.5.10,<1.0.0"
markdown = ">=3.5.0,<4.0.0"
plotext = "^5.2.8"
pyyaml = ">=6.0.0,<7.0.0"
python-dotenv = ">=1.0.0,<2.0.0"
more-itertools = ">=10.5.0,<11.0.0"
mlflow = ">=2.9.0,<3.0.0"
optuna = ">=3.5.0,<4.0.0"
flower = "^2.0.1"
xgboost = ">=2.0.0,<3.0.0"
# Observability - OpenTelemetry, Prometheus, Structured Logging
opentelemetry-api = ">=1.20.0,<2.0.0"
opentelemetry-sdk = ">=1.20.0,<2.0.0"
opentelemetry-instrumentation-fastapi = ">=0.41b0,<1.0.0"
opentelemetry-exporter-otlp-proto-grpc = ">=1.20.0,<2.0.0"
opentelemetry-exporter-prometheus = ">=0.41b0,<1.0.0"
prometheus-client = ">=0.18.0,<1.0.0"
structlog = ">=24.0.0,<25.0.0"
# Google Cloud and W&B for adapters
google-cloud-bigquery = ">=3.10.0,<4.0.0"
google-cloud-storage = ">=2.14.0,<3.0.0"
wandb = ">=0.16.0,<1.0.0"
joblib = ">=1.3.0,<2.0.0"
# Optional: Snowflake (install with: pip install .[snowflake])
snowflake-snowpark-python = { version = ">=1.20.0,<2.0.0", optional = true }
snowflake-ml-python = { version = ">=1.0.0,<2.0.0", optional = true }
snowflake-connector-python = { version = ">=3.0.0,<4.0.0", optional = true }

[tool.poetry.extras]
snowflake = ["snowflake-snowpark-python", "snowflake-ml-python", "snowflake-connector-python"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"



[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Groups
    "D",      # docs lints
    "FA",     # __future__ annotations
    "TD",     # TODO format
    "FIX",    # TODO and FIXME
    "ERA",    # Commented-out code
    "TCH",    # Type checking block
    "TRY",    # Exceptions
    "EM",     # Error messages
    # Rules
    "ANN101", # type hint on self
    "ANN401", # Any for kwargs
    "RUF012", # ClassVar on class variables
    "S101",   # forbid assert
    "S608",   # forbid raw SQL
    "PD901",  # df is a bad variable name
    "RUF001", # ambiguous unicode character
    "COM812",
    "G004", #logger with f-strings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
[dependency-groups]
dev = [
    "ipython (>=9.8.0,<10.0.0)"
]
