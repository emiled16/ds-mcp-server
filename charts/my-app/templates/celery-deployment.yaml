
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myapp.fullname" . }}-celery
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: {{ .Values.celery.replicas }}
  selector:
    matchLabels:
      app: celery
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: celery
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: celery
          image: "{{ .Values.images.celery.repository }}:{{ .Values.images.celery.tag }}"
          env:
            - name: REDIS_HOST
              value: {{ .Values.env.redisHost | quote }}
            - name: REDIS_PORT
              value: {{ .Values.env.redisPort | quote }}
            - name: POSTGRES_HOST
              value: {{ .Values.env.postgresHost | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.env.postgresPort | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.env.postgresDb | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.env.postgresUser | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_SCHEMA
              value: {{ .Values.env.postgresSchema | default "app" | quote }}
          resources:
            requests:
              cpu: {{ .Values.celery.resources.requests.cpu | quote }}
              memory: {{ .Values.celery.resources.requests.memory | quote }}
