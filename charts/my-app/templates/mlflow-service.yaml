
apiVersion: v1
kind: Service
metadata:
  name: {{ include "myapp.fullname" . }}-mlflow
  namespace: {{ .Values.global.namespace }}
spec:
  type: ClusterIP
  selector:
    app: mlflow
    release: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.mlflow.servicePort }}
      targetPort: {{ .Values.mlflow.servicePort }}
