# Dev overrides - merge with values.yaml
# Replace placeholders with Terraform outputs after tf-apply
mcp:
  replicas: 1
celery:
  replicas: 1
mlflow:
  replicas: 1
flower:
  enabled: false
  replicas: 1

ingress:
  enabled: false

externalSecrets:
  projectId: "REPLACE_WITH_PROJECT_ID"

# GCP-specific (use objectStoreBackend: gcs when deploying to GCP)
env:
  objectStoreBackend: "gcs"
  # redisHost, postgresHost, gcsArtifactsBucket - override with Terraform outputs
